name: Build Roohu ClipForge APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node for shared validation tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run shared validation tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shared/core shared/test
          cp validate.js shared/core/validate.js
          cp validate.test.js shared/test/validate.test.js
          node shared/test/validate.test.js

      - name: Reconstruct Android module from uploaded root files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/roohu/clipforge
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java ClipExporter.java Energy.java MusicSynth.java Painter.java Transcriber.java app/src/main/java/com/roohu/clipforge/
          cp Roohu-ClipForge.html app/src/main/assets/Roohu-ClipForge.html
          cp validate.js app/src/main/assets/validate.js
          cp activity_main.xml app/src/main/res/layout/activity_main.xml
          cp colors.xml strings.xml themes.xml app/src/main/res/values/
          cp ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher_foreground.xml
          cp ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp splash_bg.xml splash_glow.xml splash_logo.xml app/src/main/res/drawable/
          cp build-1.gradle app/build.gradle

          echo "Android module files staged:"
          find app/src/main -type f | sort

      - name: Download offline Vosk speech models
        shell: bash
        run: |
          set -euo pipefail
          cd app/src/main/assets
          curl -fL --retry 3 -o en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q en.zip
          mv vosk-model-small-en-us-0.15 model-en
          rm en.zip
          curl -fL --retry 3 -o hi.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q hi.zip
          mv vosk-model-small-hi-0.22 model-hi
          rm hi.zip
          test -d model-en && test -d model-hi
          du -sh model-en model-hi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roohu-ClipForge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Print actionable failure summary
        if: failure()
        run: |
          echo "::error::APK build failed. Open the failed job step and share the first actual error line."
